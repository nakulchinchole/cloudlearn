<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources | CloudLearn</title><meta name="description" content="Search, filter and download sample study PDFs for Cloud Computing, Computer Networks, Python, Database Management and Web Development."><meta name="theme-color" content="#1F1E1B">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head>
<body><a class="skip" href="#main">Skip to content</a><div id="site-header"></div>
<main id="main">
<section class="page-hero"><div class="wrap"><p class="kicker">Resource library</p><h1>Study resources.</h1><p class="lead">Ten sample PDFs written for this project. They are stored in the project folder, so downloads work offline.</p></div></section>
<section class="wrap" style="padding-bottom:5rem">
 <div class="bar" role="search"><label class="f">Search<input id="q" type="search" placeholder="Try: join, TLS, flexbox" autocomplete="off"></label>
  <label class="f">Level<select id="level"><option>All</option><option>Beginner</option><option>Intermediate</option></select></label>
  <label class="f">Sort by<select id="sort"><option value="title">Title A to Z</option><option value="subject">Subject</option><option value="pages">Most pages</option><option value="size">Smallest file</option></select></label>
  <button class="btn ghost" id="reset" type="button">Reset filters</button></div>
 <div class="chips" id="chips" role="group" aria-label="Filter by subject"></div>
 <p class="count" id="count" role="status" aria-live="polite"></p>
 <div class="grid3" id="grid"></div></section>
<dialog id="dlg" aria-labelledby="dTitle"><div class="dlg"><h2 id="dTitle" style="font-size:1.7rem;margin:0"></h2><p id="dDesc" class="muted"></p>
 <dl><dt>Subject</dt><dd id="dSubject"></dd><dt>Type</dt><dd id="dType"></dd><dt>Level</dt><dd id="dLevel"></dd><dt>Length</dt><dd id="dPages"></dd><dt>File size</dt><dd id="dSize"></dd><dt>Topics</dt><dd id="dTopics"></dd></dl>
 <div class="cta" style="margin:0"><a class="btn" id="dDl" href="pdfs/cloud-fundamentals.pdf" download>Download PDF</a><button class="btn ghost" id="dClose" type="button">Close</button></div></div></dialog></main>
<div id="site-footer"></div><script src="js/common.js"></script><script src="js/cards.js"></script><script src="js/data.js"></script><script src="js/resources.js"></script></body></html>
